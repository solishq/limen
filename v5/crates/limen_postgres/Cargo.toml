# @governance SolisForge Protocol v1.4 — Sole Governing Doctrine
# @traceability contracts/LIMEN_V5_INTEGRATION_CONTRACT.md §5.1
[package]
name = "limen_postgres"
description = "PostgreSQL storage backends for Limen v5 chain and projection subsystems."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Enable integration tests that require a live PostgreSQL instance.
# Run with: cargo test -p limen_postgres --features postgres-tests
postgres-tests = []
# Enable the synchronous ChainReadContext trait impl.
# Gated because the impl stubs cannot return proper errors on all methods
# (freshness_marker returns FreshnessMarker directly, not Result).
# Enable only when upstream limen_types provides proper constructors.
chain-read-context = []

[dependencies]
limen_types = { workspace = true }
limen_foundation_contract = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = { version = "0.14" }
bytes = "1"

[dev-dependencies]
limen_chain = { workspace = true }
limen_projection = { workspace = true }
